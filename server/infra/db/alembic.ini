; AEGIS migrations.
; NOTE: keep this file ASCII-only. Alembic reads it with the OS locale codec,
; which is cp949 on Korean Windows and fails on UTF-8 bytes.
; See migrations/README.md for the Korean notes.
;
; Run from the repo root:
;   alembic -c server/infra/db/alembic.ini upgrade head
;
; The connection URL is NOT set here. env.py reads it from AEGIS_DATABASE_URL
; (including .env) so credentials never land in the repo.

[alembic]
script_location = server/infra/db/migrations
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
