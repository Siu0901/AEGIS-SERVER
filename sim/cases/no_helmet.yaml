# 안전모를 쓰지 않은 작업자가 지게차 통행로(금지구역)로 걸어 들어간다.
#
# 서버가 이렇게 판정하기를 기대한다 (M2 범위):
#   +1.0s   `no_helmet` 후보 수신 → 이벤트 1건 생성 (status=candidate)
#   +6.5s   `zone_intrusion` 후보가 **따로** 도착 → 이벤트 1건 추가
#   이후    같은 트랙·같은 유형의 후보는 **병합**되고 새 이벤트를 만들지 않는다
#           (FN-EVT-01). 총 이벤트는 정확히 2건이어야 한다.
#
# **후보 메시지 하나에는 위반 유형이 하나만 담긴다**(§2.2). 6.5초 이후로는 같은
# 시각에 `no_helmet` 과 `zone_intrusion` 후보가 각각 하나씩, 둘로 나뉘어 나간다.
# `observed_ms` 도 유형별로 따로 잰다 — 안전모는 0초부터, 구역 침입은 6초부터다.
#
#   확정(3초)·경고·해소는 M3 이다. 여기서는 status 가 candidate 에 머문다.
#
# 좌표계: 금지구역 `forklift_lane` 은 지면 x 2~7m · y 6~11m 다. 작업자는 x_m 8.28
# (구역 밖)에서 출발해 6초 지점에 x_m 6.49 로 들어간다 — 그래서 `in_zone` 이 그때
# `null` 에서 `forklift_lane` 로 바뀐다.
#
# 지게차 11 은 통행로 안쪽에 서 있다. 12초 이후 5m 스크리닝 반경에 들어오므로
# `nearby[]` 에 실리지만, 3m 위험 반경 밖이라 `within_danger_radius: false` 다.
# 근접 위반은 나지 않는다 — 이 케이스의 위반은 안전모와 구역 침입 둘뿐이다.

