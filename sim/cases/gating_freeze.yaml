# gating_freeze — 게이팅 보류 구간에서 확정 타이머를 **초기화하지 않고 멈춘다**
#
# API명세서 §6.3 — 크롭이 작거나 분류 신뢰도가 낮아 결과를 채택하지 못하면 엣지는
# `helmet` 필드를 **생략**한다. 그 구간에서 서버는 판정을 멈춰야 한다.
# 초기화하면 작업자가 잠시 카메라에서 멀어졌다는 이유로 조건이 영원히 충족되지 않는다.
#
# 서버가 이렇게 판정하기를 기대한다:
#   0.5s ~ 2.0s   위반 관측 1.5초 적립
#   2.0s ~ 8.0s   `helmet` 생략 → **동결** (적립도 초기화도 없다)
#   8.0s ~ 9.5s   다시 관측 1.5초 → 합계 3.0초 → 확정·경고
#
#   동결이 아니라 초기화였다면 +11.0s,
#   게이팅을 무시하고 위반으로 봤다면 +3.5s 였을 것이다. 셋이 모두 구분된다.

name: gating_freeze
description: helmet 필드가 생략된 구간에서 확정 타이머가 멈추는지
cam_id: 1
frame_fps: 8

timeline:
  - at: 0.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.91
        bbox: [0.197, 0.364, 0.273, 0.764]
        helmet: "off"
        helmet_conf: 0.88
        foot_point: [0.235, 0.762]
        foot_point_m: [4.21, 7.85]
        foot_conf: 0.88
        posture: standing
        height_ratio: 0.97
        axis_angle_deg: 8.2
        stillness_s: 0.4
        in_zone: forklift_lane

  - at: 0.5
    type: candidate
    cam_id: 1
    track_id: 3
    violation_type: no_helmet
    zone_id: forklift_lane
    bbox: [0.197, 0.364, 0.273, 0.764]
    conf: 0.91
    foot_point_m: [4.21, 7.85]
    foot_conf: 0.88
    helmet: "off"
    helmet_conf: 0.88
    posture: standing
    observed_ms: 500
    nearby: []

  # --- 멀어져서 크롭이 작아졌다: `helmet` 필드 자체가 없다 (캐시도 없다) ---
  - at: 2.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.72
        bbox: [0.410, 0.470, 0.442, 0.630]
        foot_point: [0.426, 0.629]
        foot_point_m: [9.80, 14.20]
        foot_conf: 0.61
        posture: standing
        height_ratio: 0.94
        axis_angle_deg: 9.1
        stillness_s: 0.6
        in_zone: forklift_lane

  # --- 다시 가까워져 분류가 채택된다 ---
  - at: 8.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.90
        bbox: [0.216, 0.363, 0.292, 0.763]
        helmet: "off"
        helmet_conf: 0.89
        foot_point: [0.254, 0.761]
        foot_point_m: [4.60, 7.90]
        foot_conf: 0.87
        posture: standing
        height_ratio: 0.97
        axis_angle_deg: 7.8
        stillness_s: 0.4
        in_zone: forklift_lane

  - at: 12.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.91
        bbox: [0.224, 0.363, 0.300, 0.763]
        helmet: "off"
        helmet_conf: 0.90
        foot_point: [0.262, 0.761]
        foot_point_m: [4.80, 7.92]
        foot_conf: 0.88
        posture: standing
        height_ratio: 0.97
        axis_angle_deg: 7.5
        stillness_s: 0.4
        in_zone: forklift_lane

expect:
  events:
    - track_id: 3
      violation_type: no_helmet
      status: alerted
      alert_count: 1
      # ★ 3.5(동결 무시) 도 11.0(초기화) 도 아닌 9.5 여야 한다.
      confirmed_at_s: 9.5
      alerted_at_s: 9.5
  metrics:
    correction_rate: 0.0
    undetermined_rate: 0.0
    total_violations: 1
    resolved: 0
    resolved_late: 0
    unresolved: 1
    undetermined: 0
    fall_events: 0
