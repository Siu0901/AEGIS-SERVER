# 두 카메라가 **동시에** 돈다. 2채널 동작을 검증하는 유일한 시나리오다.
#
# 나머지 케이스는 카메라 하나만 써서, 오버레이가 `cam_id` 로 제대로 갈라지는지
# (엉뚱한 타일에 박스가 뜨지 않는지) 확인할 수 없었다. 여기서 그것을 본다.
#
# 서버가 이렇게 판정하기를 기대한다 (M2 범위):
#   cam 1 · 작업자 3   안전모 미착용 + 지게차 통행로 침입 → 이벤트 2건
#   cam 2 · 작업자 8   안전모 미착용                      → 이벤트 1건
#   cam 2 · 작업자 7   위반 없음                          → 이벤트 0건
#   총 3건. **`track_id` 는 카메라 안에서만 유효하므로** cam1 의 3번과
#   cam2 의 8번이 섞이면 안 된다.
#
# 화면에서 볼 것:
#   - 두 타일에 박스가 동시에 뜬다
#   - cam1 작업자 3 과 cam2 작업자 8 은 위반 표시, cam2 작업자 7 은 정상(청록)
#   - 단독 확대로 들어가도 그 채널 박스는 그대로, 다른 채널은 계속 수신된다
#
# 지게차는 cam2 에만 있다. cam1 은 사람만 나오므로 거리선이 없어야 한다.

name: both_cameras
description: cam1·cam2 동시 송출 — 2채널 오버레이 분리 검증
cam_id: 1
frame_fps: 8

timeline:
  - at: 0.0
    type: heartbeat
    cameras:
      - {cam_id: 1, sub_state: ok, fps: 8.2}
      - {cam_id: 2, sub_state: ok, fps: 8.1}
    gpu_util: 0.58
    mem_used_mb: 4310
    cls_calls_per_min: 176
    cls_cache_hit_rate: 0.80
    depth_calls_per_min: 31

  # ── cam 1 키프레임 ① ───────────────────────────────────
