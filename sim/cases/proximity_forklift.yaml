# proximity_forklift — 지게차가 다가오고, 근접 위반이 나고, 멀어져서 해소된다 (FN-DET-08)
#
# 제조업 사망사고 기인물 1위가 지게차다. 적재 화물이 운전자 시야를 가려 보행자를
# 인지하지 못하는 것이 구조적 취약성이고, 그래서 이 시나리오가 M7 의 대표 경로다.
#
#   +0s    작업자(track 3)가 통행로 왼쪽 끝에 있다. 지게차(track 11)는 오른쪽에서
#          **포크를 왼쪽으로 뻗은 채 이동 중**이다
#   +6s    작업자가 지게차 포크 앞까지 걸어온다. **최근접 1.55m** 로 경고 임계(2.0m)
#          아래이지만, 접지점↔앵커 거리는 **2.90m** 로 임계 밖이다
#   +6.5s~ 엣지가 `proximity` 후보를 올린다 (**판정은 하지 않는다**)
#   +9.5s  서버가 확정(3초)하고 방송·경광등을 낸다
#   +12s   작업자가 물러난다 → 후보가 끊긴다
#   +22s   해소(10초) → `resolved`
#
# ★ **거리는 시나리오가 적지 않는다.** `nearby: auto` 를 적으면 같은 순간 프레임의
#   마스크에서 `packages/vision` 이 최근접 거리를 계산해 싣는다(FN-DET-09). 지게차
#   `mask.fork` 가 포크 길이이며, 그 끝이 실제 접촉 위험 지점이다.
#
# ★ **위험 반경(3.0m)과 경고 임계(2.0m)는 다른 값이다.** 3m 안에 들어온 순간
#   `within_danger_radius` 가 켜지지만 후보가 되는 것은 2m 안이다(§4.5).
#
# ★ **이 시나리오가 잠그는 것: 확정과 해소가 같은 양을 보는가.**
#   최근접 1.55m 와 접지점↔앵커 2.90m 는 경고 임계(2.0m)를 **사이에 두고** 갈린다.
#   서버가 §2.1 `frame.nearby[].dist_m` 이 아니라 접지점 거리로 해소를 판정하면, 엣지가
#   후보를 올리는 매 프레임마다 서버는 「이미 해소」로 보아 **확정에 도달하지 못한다.**
#   그래서 작업자를 더 가까이 세워 두 값이 함께 임계 안에 들게 하는 우회를 썼었고,
#   §2.1 이 `nearby` 를 신설하면서 되돌렸다. 두 거리가 갈리는 위치가 이 시나리오의 요점이다.
#
# ★ **뎁스는 여기서 실행되지 않는다**(`depth_verified: false`). 1.55m 는 회색지대
#   (2.0~3.5m) 아래라 트리거 A 가 걸리지 않고, 두 bbox 도 화면에서 겹치지 않아 B 도
#   걸리지 않는다. 「검증하지 않았다」가 `false` 로 나가는 것은 §6.6 이 정한 규약이며,
#   그래서 근접 후보 판정은 회색지대에서만 이 값을 요구한다(`proximity_candidate`).

name: proximity_forklift
description: 지게차 접근 → 근접 위반 확정 → 이탈 → 해소 (FN-DET-08 · 09 · 11)
cam_id: 1
frame_fps: 8

timeline:
  - at: 0.0
    type: heartbeat
    cameras:
      - {cam_id: 1, sub_state: ok, fps: 8.1}
      - {cam_id: 2, sub_state: ok, fps: 8.0}
    gpu_util: 0.44
    mem_used_mb: 3860
    cls_calls_per_min: 97
    cls_cache_hit_rate: 0.86
    depth_calls_per_min: 21

  # ── ①  작업자는 통행로 왼쪽(지면 x ≈ 3m), 지게차는 오른쪽(x ≈ 8m) ──
  - at: 0.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.93
        bbox: [0.135, 0.260, 0.215, 0.7576]
        helmet: "on"
        helmet_conf: 0.94
        foot_point: [0.175, 0.7576]
        foot_conf: 0.90
        in_zone: forklift_lane
        mask: {posture: standing, motion: working}
      - class: vehicle
        track_id: 11
        conf: 0.90
        bbox: [0.5647, 0.6300, 0.8247, 0.7576]
        anchor: [0.7164, 0.7576]
        moving: true
        danger_radius_m: 3.0
        mask: {fork: 0.35}

  # ── ②  작업자가 지게차 바로 앞까지 걸어온다 (지면 x ≈ 6.3m) ──
  - at: 6.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.94
        bbox: [0.3618, 0.260, 0.4418, 0.7576]
        helmet: "on"
        helmet_conf: 0.94
        foot_point: [0.4018, 0.7576]
        foot_conf: 0.91
        in_zone: forklift_lane
        mask: {posture: standing, motion: working}
      - class: vehicle
        track_id: 11
        conf: 0.90
        bbox: [0.5647, 0.6300, 0.8247, 0.7576]
        anchor: [0.7164, 0.7576]
        moving: true
        danger_radius_m: 3.0
        mask: {fork: 0.35}

  - at: 6.5
    type: candidate
    cam_id: 1
    track_id: 3
    violation_type: proximity
    zone_id: forklift_lane
    bbox: [0.3618, 0.260, 0.4418, 0.7576]
    conf: 0.94
    foot_point: [0.4018, 0.7576]
    foot_conf: 0.91
    helmet: "on"
    helmet_conf: 0.94
    posture: standing
    observed_ms: 500
    nearby: auto

  - at: 8.0
    type: candidate
    cam_id: 1
    track_id: 3
    violation_type: proximity
    zone_id: forklift_lane
    bbox: [0.3618, 0.260, 0.4418, 0.7576]
    conf: 0.94
    foot_point: [0.4018, 0.7576]
    foot_conf: 0.91
    helmet: "on"
    helmet_conf: 0.94
    posture: standing
    observed_ms: 2000
    nearby: auto

  - at: 9.5
    type: candidate
    cam_id: 1
    track_id: 3
    violation_type: proximity
    zone_id: forklift_lane
    bbox: [0.3618, 0.260, 0.4418, 0.7576]
    conf: 0.94
    foot_point: [0.4018, 0.7576]
    foot_conf: 0.91
    helmet: "on"
    helmet_conf: 0.94
    posture: standing
    observed_ms: 3500
    nearby: auto

  - at: 10.0
    type: heartbeat
    cameras:
      - {cam_id: 1, sub_state: ok, fps: 8.0}
      - {cam_id: 2, sub_state: ok, fps: 8.0}
    gpu_util: 0.47
    mem_used_mb: 3880
    cls_calls_per_min: 99
    cls_cache_hit_rate: 0.85
    depth_calls_per_min: 34

  - at: 11.0
    type: candidate
    cam_id: 1
    track_id: 3
    violation_type: proximity
    zone_id: forklift_lane
    bbox: [0.3618, 0.260, 0.4418, 0.7576]
    conf: 0.94
    foot_point: [0.4018, 0.7576]
    foot_conf: 0.91
    helmet: "on"
    helmet_conf: 0.94
    posture: standing
    observed_ms: 5000
    nearby: auto

  # ── ②′  후보가 나가는 동안 제자리에 머문다.
  #        키프레임을 두지 않으면 보간이 ②와 ③ 사이를 곧장 이어 버려, 후보를 올리는
  #        내내 작업자가 이미 물러나는 중이 된다 — 거리가 매 프레임 늘어난다.
  - at: 12.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.94
        bbox: [0.3618, 0.260, 0.4418, 0.7576]
        helmet: "on"
        helmet_conf: 0.94
        foot_point: [0.4018, 0.7576]
        foot_conf: 0.91
        in_zone: forklift_lane
        mask: {posture: standing, motion: working}
      - class: vehicle
        track_id: 11
        conf: 0.90
        bbox: [0.5647, 0.6300, 0.8247, 0.7576]
        anchor: [0.7164, 0.7576]
        moving: true
        danger_radius_m: 3.0
        mask: {fork: 0.35}

  # ── ③  작업자가 물러난다 (지면 x ≈ 3m). 후보가 끊기고 해소 타이머가 돈다 ──
  - at: 15.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.93
        bbox: [0.135, 0.260, 0.215, 0.7576]
        helmet: "on"
        helmet_conf: 0.93
        foot_point: [0.175, 0.7576]
        foot_conf: 0.90
        in_zone: forklift_lane
        mask: {posture: standing, motion: working}
      - class: vehicle
        track_id: 11
        conf: 0.90
        bbox: [0.5647, 0.6300, 0.8247, 0.7576]
        anchor: [0.7164, 0.7576]
        moving: true
        danger_radius_m: 3.0
        mask: {fork: 0.35}

  - at: 20.0
    type: heartbeat
    cameras:
      - {cam_id: 1, sub_state: ok, fps: 8.1}
      - {cam_id: 2, sub_state: ok, fps: 8.0}
    gpu_util: 0.43
    mem_used_mb: 3855
    cls_calls_per_min: 96
    cls_cache_hit_rate: 0.87
    depth_calls_per_min: 12

  # ── ④  계속 떨어져 있다. 해소 판정이 끝날 때까지 관측이 이어져야 한다 ──
  - at: 26.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.92
        bbox: [0.135, 0.260, 0.215, 0.7576]
        helmet: "on"
        helmet_conf: 0.93
        foot_point: [0.175, 0.7576]
        foot_conf: 0.90
        in_zone: forklift_lane
        mask: {posture: standing, motion: working}
      - class: vehicle
        track_id: 11
        conf: 0.89
        bbox: [0.5647, 0.6300, 0.8247, 0.7576]
        anchor: [0.7164, 0.7576]
        moving: true
        danger_radius_m: 3.0
        mask: {fork: 0.35}

expect:
  tail_s: 4.0
  events:
    - track_id: 3
      violation_type: proximity
      status: resolved
      zone_id: forklift_lane
      alert_count: 1
      confirmed_at_s: 9.5
      alerted_at_s: 9.5
  alerts:
    - at_s: 9.5
      violation_type: proximity
      level: 2
      repeat: false
      sound: proximity.wav
  metrics:
    correction_rate: 1.0
    undetermined_rate: 0.0
    total_violations: 1
    resolved: 1
    resolved_late: 0
    unresolved: 0
    undetermined: 0
  # ★ 거리는 계산된 값이다. 시나리오는 마스크 형상만 적었다.
  distances:
    - at_s: 8.0
      track_id: 3
      vehicle_track_id: 11
      mask_nearest_below_m: 2.0
      # ★ 같은 순간의 접지점↔앵커 거리는 임계 **밖**이다. 두 값이 갈리지 않으면
      #   이 시나리오는 「확정과 해소가 같은 양을 보는가」를 확인하지 못한다.
      anchor_above_m: 2.0
      within_danger_radius: true
      # 회색지대(2.0~3.5m) 아래이고 bbox 도 겹치지 않아 뎁스 트리거가 걸리지 않는다.
      # 「검증하지 않았다」도 `false` 다(§6.6).
      depth_verified: false
