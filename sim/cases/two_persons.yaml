# 작업자 두 명과 지게차 한 대. **한 명만 안전모를 쓰지 않았다.**
#
# 서버가 이렇게 판정하기를 기대한다 (M2 범위):
#   작업자 7 — 안전모 착용, 위반 없음. 이벤트가 생기면 안 된다.
#   작업자 8 — `no_helmet` 이벤트 1건. 지게차가 2m 안으로 들어온 뒤 `proximity` 1건 추가.
#   총 이벤트 2건이며 둘 다 track_id 8 에 붙는다.
#
# 이 케이스의 목적은 **박스 색이 트랙마다 따로 결정되는지** 보는 것이다. 오버레이가
# 프레임 단위가 아니라 트랙 단위로 위반을 싣는지(§5.1 `objects[].violations`)가 여기서
# 드러난다 — 한 명은 청록, 한 명은 적색이어야 한다.
#
# 지게차 12 는 이동 중이며(`moving: true`) 작업자 8 쪽으로 접근한다.
#   +0s  3.11m (위험 반경 3.0m 밖)
#   +6s  2.33m (위험 반경 안 · 근접 임계 2.0m 밖)
#   +9s  1.96m (근접 임계 통과 → `proximity` 후보 시작)
#   +18s 1.18m
#
# cam 2 에는 금지구역을 두지 않았다. `in_zone` 은 계속 `null` 이다.
#
# **후보 메시지 하나에는 위반 유형이 하나만 담긴다**(§2.2). 9초 이후로는 `no_helmet`
# 과 `proximity` 후보가 같은 시각에 각각 하나씩 나간다. `observed_ms` 는 안전모가
# 0초부터, 근접이 8.4초(거리가 2.0m 를 통과한 시점)부터다.

name: two_persons
description: 작업자 2명 + 지게차 1대 · 한 명만 안전모 미착용 (no_helmet + proximity)
cam_id: 2
frame_fps: 8

