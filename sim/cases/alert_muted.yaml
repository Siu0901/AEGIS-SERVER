# alert_muted — 경고 일시중지 중에는 방송도 경광등도 나가지 않는다
#
# FN-ALM-05 (기능명세서 §4.3) — 정비 작업 등으로 경고를 기한부로 멈춘다.
#
# 이 시나리오가 잠그는 것은 **무엇이 멈추고 무엇이 멈추지 않는가**이다.
#
#   멈춘다      wav 방송 · aegis/alert 발행 (장치가 조용해진다)
#   멈추지 않는다 확정 판정 · alerted_at 기록 · 클립 예약 · 시정 판정 · 지표
#
# 이벤트까지 멈추면 정비 시간 동안의 위반이 통째로 사라져, 그 구간에 사고가 나도
# 기록이 없다. 반대로 장치까지 울리면 일시중지가 아무 의미가 없다.
#
# ⚠ 방송이 나가지 않은 이벤트가 「**방송 후** 시정률」 분모에 남는 것이 옳은지는
#   명세서에 정의가 없다. docs/INDEX.md 「명세서 확인 필요」에 올려 두었고, 지금은
#   지표를 건드리지 않는 쪽(= 상태머신 무영향)으로 두었다.

name: alert_muted
description: 일시중지 중 장치만 조용하고 이벤트·지표는 그대로 도는지
cam_id: 1
frame_fps: 8

timeline:
  - at: 0.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.91
        bbox: [0.197, 0.364, 0.273, 0.764]
        helmet: "off"
        helmet_conf: 0.88
        foot_point: [0.235, 0.762]
        foot_point_m: [4.21, 7.85]
        foot_conf: 0.88
        posture: standing
        height_ratio: 0.97
        axis_angle_deg: 8.2
        stillness_s: 0.4
        in_zone: forklift_lane

  - at: 0.5
    type: candidate
    cam_id: 1
    track_id: 3
    violation_type: no_helmet
    zone_id: forklift_lane
    bbox: [0.197, 0.364, 0.273, 0.764]
    conf: 0.91
    foot_point_m: [4.21, 7.85]
    foot_conf: 0.88
    helmet: "off"
    helmet_conf: 0.88
    posture: standing
    observed_ms: 500
    nearby: []

  # --- 안전모 착용 → 위반 소멸 관측 시작 ---
  - at: 6.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.92
        bbox: [0.262, 0.361, 0.339, 0.762]
        helmet: "on"
        helmet_conf: 0.94
        foot_point: [0.300, 0.760]
        foot_point_m: [6.02, 7.91]
        foot_conf: 0.89
        posture: standing
        height_ratio: 0.98
        axis_angle_deg: 6.4
        stillness_s: 0.2
        in_zone: forklift_lane

  - at: 17.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.90
        bbox: [0.281, 0.360, 0.358, 0.761]
        helmet: "on"
        helmet_conf: 0.95
        foot_point: [0.319, 0.759]
        foot_point_m: [6.44, 7.93]
        foot_conf: 0.88
        posture: standing
        height_ratio: 0.98
        axis_angle_deg: 5.1
        stillness_s: 0.3
        in_zone: forklift_lane

expect:
  events:
    - track_id: 3
      violation_type: no_helmet
      # ★ 방송이 없었어도 상태 전이는 그대로다.
      status: resolved
      alert_count: 1
      alerted_at_s: 3.5
      resolved_at_s: 16.0
      clip_status: ready
  # ★ 한 건도 나가지 않는다. 방송도 경광등도.
  alerts: []
  metrics:
    correction_rate: 1.0
    undetermined_rate: 0.0
    total_violations: 1
    resolved: 1
    resolved_late: 0
    unresolved: 0
    undetermined: 0
    fall_events: 0

# 확정(+3.5s)보다 먼저 건다.
mute:
  - at: 1.0
    cam_id: 1
    minutes: 15
    reason: 정비 작업
