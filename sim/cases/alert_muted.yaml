# alert_muted — 경고 일시중지 중에는 방송도 경광등도 나가지 않는다
#
# FN-ALM-05 (기능명세서 §4.3) — 정비 작업 등으로 경고를 기한부로 멈춘다.
#
# 이 시나리오가 잠그는 것은 **무엇이 멈추고 무엇이 멈추지 않는가**이다.
#
#   멈춘다      wav 방송 · aegis/alert 발행 (장치가 조용해진다)
#               그리고 **시정률 집계** — 방송이 없었으니 「방송 후」의 모집단이 아니다
#   멈추지 않는다 확정 판정 · alerted_at 기록 · 클립 예약 · 시정 판정 (기록은 남는다)
#
# 이벤트까지 멈추면 정비 시간 동안의 위반이 통째로 사라져, 그 구간에 사고가 나도
# 기록이 없다. 반대로 장치까지 울리면 일시중지가 아무 의미가 없다.
#
# ★ 명세서 §4.8 이 정했다 — `alert_suppressed = true` 는 **전량 제외**하고
#   `suppressed` 로 별도 집계한다. 그래서 이 시나리오의 시정률은 `1.0` 이 아니라
#   **`null`** 이다(판정 가능한 이벤트가 0건). 해소는 됐지만 그것을 "방송 후 시정"으로
#   셀 근거가 없다 — 작업자는 아무 소리도 듣지 못했다.

name: alert_muted
description: 일시중지 중 장치만 조용하고 이벤트·지표는 그대로 도는지
cam_id: 1
frame_fps: 8

timeline:
  - at: 0.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.91
        bbox: [0.197, 0.364, 0.273, 0.764]
        helmet: "off"
        helmet_conf: 0.88
        foot_point: [0.235, 0.762]
        foot_conf: 0.88
        posture: standing
        height_ratio: 0.97
        axis_angle_deg: 8.2
        stillness_s: 0.4
        in_zone: forklift_lane

  - at: 0.5
    type: candidate
    cam_id: 1
    track_id: 3
    violation_type: no_helmet
    zone_id: forklift_lane
    bbox: [0.197, 0.364, 0.273, 0.764]
    conf: 0.91
    foot_point: [0.235, 0.764]
    foot_conf: 0.88
    helmet: "off"
    helmet_conf: 0.88
    posture: standing
    observed_ms: 500
    nearby: []

  # --- 안전모 착용 → 위반 소멸 관측 시작 ---
  - at: 6.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.92
        bbox: [0.262, 0.361, 0.339, 0.762]
        helmet: "on"
        helmet_conf: 0.94
        foot_point: [0.300, 0.760]
        foot_conf: 0.89
        posture: standing
        height_ratio: 0.98
        axis_angle_deg: 6.4
        stillness_s: 0.2
        in_zone: forklift_lane

  - at: 17.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.90
        bbox: [0.281, 0.360, 0.358, 0.761]
        helmet: "on"
        helmet_conf: 0.95
        foot_point: [0.319, 0.759]
        foot_conf: 0.88
        posture: standing
        height_ratio: 0.98
        axis_angle_deg: 5.1
        stillness_s: 0.3
        in_zone: forklift_lane

expect:
  # 예약 실행은 확정(+3.5s)에서 22초 뒤다(사후 10 + 세그먼트 10 + 여유 2).
  # 해소(+16.0s) 뒤이므로 늘려도 상태는 그대로다.
  tail_s: 9.0
  events:
    - track_id: 3
      violation_type: no_helmet
      # ★ 방송이 없었어도 상태 전이와 기록은 그대로다.
      status: resolved
      alert_count: 1
      alerted_at_s: 3.5
      resolved_at_s: 16.0
      clip_status: ready
      # ★ 방송이 없었다는 사실이 이벤트에 남는다 (§6 events.alert_suppressed).
      alert_suppressed: true
  # ★ 한 건도 나가지 않는다. 방송도 경광등도.
  alerts: []
  metrics:
    # ★ 분모가 0이므로 `null` 이다. `0.0`(시정률 0%)도 `1.0`(전부 시정)도 아니다 —
    #   방송 후 시정률로 판정할 수 있는 이벤트가 한 건도 없다는 뜻이다.
    correction_rate: null
    undetermined_rate: null
    total_violations: 0
    resolved: 0
    resolved_late: 0
    unresolved: 0
    undetermined: 0
    # ★ 사라지지 않는다. 분모가 왜 비었는지가 이 숫자로 설명된다.
    suppressed: 1
    fall_events: 0

# 확정(+3.5s)보다 먼저 건다.
mute:
  - at: 1.0
    cam_id: 1
    minutes: 15
    reason: 정비 작업
