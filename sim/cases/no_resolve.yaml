# no_resolve — 경고 후에도 시정되지 않아 쿨다운 뒤 재경고
#
# 서버가 이렇게 판정하기를 기대한다:
#   +3.5s   확정·경고            · alert_count = 1
#   +33.5s  재경고(re_alerted)   · cooldown_s = 30, alert_count = 2
#   끝까지 미해소                 · 시정률 분모에는 들어가고 분자에는 못 들어간다
#
# 안전모를 끝까지 쓰지 않는다. 해소 타이머는 한 번도 흐르지 않는다.

name: no_resolve
description: 미시정 상태로 쿨다운이 지나 재경고까지 간 경우
cam_id: 1
frame_fps: 8

timeline:
  - at: 0.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.91
        bbox: [0.197, 0.364, 0.273, 0.764]
        helmet: "off"
        helmet_conf: 0.88
        foot_point: [0.235, 0.762]
        foot_conf: 0.88
        posture: standing
        height_ratio: 0.97
        axis_angle_deg: 8.2
        stillness_s: 0.4
        in_zone: forklift_lane

  - at: 0.5
    type: candidate
    cam_id: 1
    track_id: 3
    violation_type: no_helmet
    zone_id: forklift_lane
    bbox: [0.197, 0.364, 0.273, 0.764]
    conf: 0.91
    foot_point: [0.235, 0.764]
    foot_conf: 0.88
    helmet: "off"
    helmet_conf: 0.88
    posture: standing
    observed_ms: 500
    nearby: []

  # 엣지는 규칙이 걸려 있는 동안 후보를 계속 올린다. 서버는 새 이벤트를 만들지 않는다.
  - at: 20.0
    type: candidate
    cam_id: 1
    track_id: 3
    violation_type: no_helmet
    zone_id: forklift_lane
    bbox: [0.205, 0.363, 0.281, 0.763]
    conf: 0.93
    foot_point: [0.243, 0.763]
    foot_conf: 0.90
    helmet: "off"
    helmet_conf: 0.91
    posture: standing
    observed_ms: 19500
    nearby: []

  - at: 40.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.90
        bbox: [0.213, 0.362, 0.289, 0.762]
        helmet: "off"
        helmet_conf: 0.92
        foot_point: [0.251, 0.760]
        foot_conf: 0.89
        posture: standing
        height_ratio: 0.97
        axis_angle_deg: 7.6
        stillness_s: 0.5
        in_zone: forklift_lane

expect:
  events:
    - track_id: 3
      violation_type: no_helmet
      status: re_alerted
      alert_count: 2
      alerted_at_s: 3.5
      clip_status: ready
  alerts:
    # ★ 재경고는 `repeat: true` 로 나간다 — ESP32 가 점멸 패턴을 달리해 상습 상황을
    #   구분한다(§3). 쿨다운(30초)이 없으면 이 목록이 훨씬 길어진다.
    - at_s: 3.5
      violation_type: no_helmet
      level: 2
      repeat: false
      sound: no_helmet.wav
    - at_s: 33.5
      violation_type: no_helmet
      level: 2
      repeat: true
      sound: no_helmet.wav
  metrics:
    correction_rate: 0.0
    undetermined_rate: 0.0
    total_violations: 1
    resolved: 0
    resolved_late: 0
    unresolved: 1
    undetermined: 0
    fall_events: 0
