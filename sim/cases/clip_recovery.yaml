# clip_recovery — pending 상태에서 서버를 재시작해도 클립 잡이 살아남는다
#
# FN-REC-03 (기능명세서 §4.4) — "서버 재시작 시 `pending` 상태 잡은 DB에서 복구해
# 재실행한다".
#
# 이 시나리오가 잠그는 것: **예약이 메모리에 있으면 안 된다.**
#
#   +3.5s   확정 → 키프레임 즉시 · clip_status = pending · 예약 등록
#           예약 실행 시각 = confirmed_at + clip_post_roll_s(10) + margin(2) = +15.5s
#   +8.0s   ★ 서버를 내렸다 올린다. 상태머신도 예약 큐도 새로 만들어지고,
#           남는 것은 저장소(DB)뿐이다.
#   +15.5s  새로 뜬 서버가 DB 에서 pending 잡을 집어 실행 → ready
#
# 메모리 타이머로 예약했다면 재시작 순간 잡이 사라지고 clip_status 가 영원히
# pending 으로 남는다. 그 이벤트는 증거 영상 없이 시정률에만 계상된다.
#
# 재시작 뒤 해소 타이머는 0부터 다시 찬다(FN-EVT-02 복구 규칙). 그래서 이 시나리오의
# 이벤트는 resolved 까지 가지 않고 alerted 로 남는다 — 그것이 정확한 동작이다.

name: clip_recovery
description: 확정 후 재시작해도 예약된 클립 추출이 복구되어 ready 로 끝나는지
cam_id: 1
frame_fps: 8

timeline:
  - at: 0.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.91
        bbox: [0.197, 0.364, 0.273, 0.764]
        helmet: "off"
        helmet_conf: 0.88
        foot_point: [0.235, 0.762]
        foot_conf: 0.88
        posture: standing
        height_ratio: 0.97
        axis_angle_deg: 8.2
        stillness_s: 0.4
        in_zone: forklift_lane

  - at: 0.5
    type: candidate
    cam_id: 1
    track_id: 3
    violation_type: no_helmet
    zone_id: forklift_lane
    bbox: [0.197, 0.364, 0.273, 0.764]
    conf: 0.91
    foot_point: [0.235, 0.764]
    foot_conf: 0.88
    helmet: "off"
    helmet_conf: 0.88
    posture: standing
    observed_ms: 500
    nearby: []

  # --- 안전모 착용 → 위반 소멸 관측 시작 ---
  - at: 6.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.92
        bbox: [0.262, 0.361, 0.339, 0.762]
        helmet: "on"
        helmet_conf: 0.94
        foot_point: [0.300, 0.760]
        foot_conf: 0.89
        posture: standing
        height_ratio: 0.98
        axis_angle_deg: 6.4
        stillness_s: 0.2
        in_zone: forklift_lane

  - at: 17.0
    type: frame
    cam_id: 1
    objects:
      - class: person
        track_id: 3
        conf: 0.90
        bbox: [0.281, 0.360, 0.358, 0.761]
        helmet: "on"
        helmet_conf: 0.95
        foot_point: [0.319, 0.759]
        foot_conf: 0.88
        posture: standing
        height_ratio: 0.98
        axis_angle_deg: 5.1
        stillness_s: 0.3
        in_zone: forklift_lane

expect:
  # 예약 실행 시각은 `확정 + 사후 10s + 세그먼트 + 여유 2s` 다(기능명세서 §4.4).
  # 세그먼트 10초 환경이면 +25.5s 라 마지막 프레임(+17.0s)을 한참 넘고, 그만큼
  # tail 을 늘리면 관측이 끊긴 트랙이 `lost` 로 가서 이 시나리오가 보려는 것이
  # 흐려진다. 그래서 **REC 이 2초 세그먼트로 도는 환경**으로 두어 +17.5s 에 실행되게
  # 한다 — 재시작을 넘어 pending → ready 로 가는지가 이 시나리오의 전부다.
  tail_s: 1.0
  restarts: 1
  events:
    - track_id: 3
      violation_type: no_helmet
      # 재시작 복구는 타이머를 0부터 다시 채운다. 마지막 프레임(+17.0s)까지
      # 위반 소멸이 10초를 채우지 못하므로 해소되지 않는다 — 의도한 결과다.
      status: alerted
      alert_count: 1
      alerted_at_s: 3.5
      # ★ 이것이 이 시나리오의 전부다. 재시작을 넘어 pending → ready 로 갔는가.
      clip_status: ready
  alerts:
    - at_s: 3.5
      violation_type: no_helmet
      level: 2
      repeat: false
      sound: no_helmet.wav
  metrics:
    correction_rate: 0.0
    undetermined_rate: 0.0
    total_violations: 1
    resolved: 0
    resolved_late: 0
    unresolved: 1
    undetermined: 0
    fall_events: 0

# ★ 확정(+3.5s)과 예약 실행(+17.5s) 사이. 잡이 아직 pending 인 시점이다.
restart_at: [8.0]

# 세그먼트 길이는 서버가 정하지 않고 REC 의 `GET /status` 에서 읽는다(§4.7).
rec:
  segment_seconds: 2
