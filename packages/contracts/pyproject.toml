[project]
name = "aegis-contracts"
version = "0.1.0"
description = "AEGIS 계약 스키마 — API명세서 1:1 대응 Pydantic v2 모델"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_contracts"]
