[project]
name = "aegis-recorder"
version = "0.1.0"
description = "AEGIS REC — 메인 스트림 세그먼트 녹화와 구간 추출 (API명세서 §4.7)"
requires-python = ">=3.13"
dependencies = [
    "aegis-contracts",
    "aegis-vision",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

# 휠로 빌드하지 않는다. `recorder` 는 레포 루트를 기준으로 import 되는 앱 패키지다.
# M9 에 젯슨으로 옮길 때는 이 디렉토리와 `packages/` 만 복사하면 된다.
[tool.uv]
package = false
