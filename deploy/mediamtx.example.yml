# 가짜 IP 카메라 RTSP 서버 설정
#
# 영상은 듀얼 스트림으로 분리된다(CLAUDE.md 아키텍처).
#
#   경로            해상도       코덱    fps  화면비  용도
#   camN/main   1920×1080   H.264   15   16:9   서버 — 라이브 · 7일 녹화 · 클립 원본
#   camN/sub      640×360   H.264   15   16:9   엣지 — 추론
#
# **두 스트림의 화면비는 반드시 16:9로 같아야 한다**(API명세서 §1.2).
# 엣지는 서브에서 정규화 좌표를 산출하고 대시보드는 그 좌표를 메인 위에 그리므로,
# 화면비가 다르면 좌표가 한쪽 축으로 눌려 박스가 어긋난다.
# 서브를 정사각(640×640)으로 설정하면 화각이 잘리므로 쓰지 않는다.
# (모델 입력의 640×384 rect letterbox 는 엣지 내부 전처리이며 스트림 규격과 무관하다.)
#
# 실제 IP 카메라로 교체할 때도 위 표를 그대로 맞춘다. 어긋나면 엣지 추론 예산
# (기능명세서 §5)과 오버레이 정합(±100ms) 실측이 의미를 잃는다.
#
# 송출:  uv run tasks.py cams   (deploy/fake_cams.py — 화면비를 검증한다)
# 재생:  rtsp://localhost:8554/cam1/main

logLevel: info

# 퍼블리셔·리더 인증 없음 — 로컬 개발 전용이다.
#
# `api` 권한을 빠뜨리면 제어 API(:9997)가 `authentication error` 만 돌려주고,
# 서버의 스트림 감시(FN-SYS-01)가 **모든 카메라를 끊긴 것으로 보고**하게 된다.
# 카메라는 멀쩡한데 화면이 전부 빨개지므로 반드시 함께 열어둔다.
authMethod: internal
authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

rtmp: yes
rtmpAddress: :1935

# --- 대시보드 라이브뷰 ---
#
# WebRTC(WHEP)가 기본이고 HLS 는 폴백이다(FN-REC-01). 두 경로의 지연이 크게 다르므로
# 화면에 어느 쪽으로 재생 중인지 표시하고, 지연은 소성된 타임코드로 실측한다.
#
# LL-HLS 로도 지연을 최소로 잡는다. 오버레이 시간 정합(±100ms) 목표 때문이다.
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 200ms
hlsPartDuration: 100ms
hlsAlwaysRemux: yes
# 브라우저가 다른 오리진(vite dev 서버 :5173)에서 재생하므로 CORS 를 열어둔다.
hlsAllowOrigins: ['*']

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']

# **컨테이너 안에서 ICE 후보를 자동 수집하면 안 된다.**
# mediamtx 는 자기 컨테이너 IP(172.x)를 host 후보로 올리는데, 윈도우 호스트의
# 브라우저는 그 주소에 닿을 수 없어 WHEP 연결이 조용히 타임아웃된다.
# 인터페이스 수집을 끄고 127.0.0.1 만 광고한 뒤, 그 포트를 compose 에서 매핑한다.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]

# ★ **UDP 후보를 올리지 않는다 — Docker Desktop(Windows) 에서 RTP 가 통과하지 못한다.**
#
# UDP 를 켜두면 ICE 는 **성공한다.** mediamtx 로그에 `peer connection established`
# 가 찍히고 트랙 읽기도 시작된다. 그런데 화면은 검은 채로 남고 브라우저는
# `videoWidth = 2` (크롬이 디코드 불가일 때 내놓는 자리표시자)를 보고한다.
#
# 원인은 패킷 크기다. STUN 바인딩은 100바이트 안쪽이라 Docker 의 UDP 전달을 통과하지만
# RTP 비디오는 1,200바이트급이라 넘어오지 못한다. ICE 는 STUN 만 보고 그 경로를
# 「유효」로 확정하므로 **TCP 로 폴백하지도 않는다** — 조용히 검은 화면으로 끝난다.
#
# 코덱 문제로 오인하기 쉽다(프로파일을 baseline 으로 맞춰도 증상이 같다). 실제로
# RTSP·HLS 는 정상이고 WebRTC 만 실패하는 것이 이 원인의 특징이다.
#
# TCP 만 남기면 Docker 의 TCP 포트 발행을 그대로 타므로 확실하다. 지연은 UDP 대비
# 수십 ms 늘지만 HLS 폴백(약 2.5초)보다 압도적으로 낫다.
# 젯슨(리눅스 host 네트워크)으로 옮기면 이 제약이 사라지므로 UDP 를 되살려도 된다.
#
# **키를 지우는 것으로는 안 꺼진다** — mediamtx 가 기본값 `:8189` 를 채운다.
# 빈 문자열로 명시해야 UDP 리스너가 뜨지 않는다(로그의 `(UDP/ICE)` 가 사라지는지로 확인).
webrtcLocalUDPAddress: ''
webrtcLocalTCPAddress: :8189

api: yes
apiAddress: :9997

# **mediamtx 내장 녹화(`record: yes`)를 쓰지 않는다.**
# 7일 링버퍼는 REC 컴포넌트(`recorder/`)가 RTSP 를 직접 구독해 리먹스 세그먼트로 쌓는다
# (기능명세서 §4.4 「녹화 컴포넌트(REC) 분리」). 운용 시 녹화 디스크는 서버가 아니라
# 엣지 NVMe SSD 에 있고, 서버는 API명세서 §4.7 HTTP API 로만 구간을 받아간다.
# 여기서 같이 녹화하면 저장 위치가 둘로 갈라져 보존 정책과 용량 집계가 어긋난다.
pathDefaults:
  record: no

paths:
  # --- 카메라 1 ---
  cam1/main:  # 1920×1080 · H.264 · 15fps → 서버(라이브) · REC(녹화)
    source: publisher
  cam1/sub:  # 640×360 · H.264 · 15fps → 엣지
    source: publisher

  # --- 카메라 2 ---
  cam2/main:  # 1920×1080 · H.264 · 15fps → 서버(라이브) · REC(녹화)
    source: publisher
  cam2/sub:  # 640×360 · H.264 · 15fps → 엣지
    source: publisher
