# AEGIS MQTT 브로커 — 로컬 개발용
#
# 토픽 (API명세서 §3)
#   aegis/alert          서버 발행 → ESP32 구독   경고 발동
#   aegis/device/status  ESP32 발행 → 서버 구독   장치 상태
#
# 익명 접속을 허용한다. **로컬 개발 전용 설정이며 현장 배포 시에는
# 반드시 인증을 켠다.** 현장에서는 브로커가 폐쇄망 안에 있다.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true

# 경고는 유실되면 안 되지만 오래된 경고를 뒤늦게 받아도 곤란하다.
max_queued_messages 100
message_size_limit 8192
