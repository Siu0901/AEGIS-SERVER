[project]
name = "pythonproject16"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = []

# --------------------------------------------------------------------------
# uv 워크스페이스
# --------------------------------------------------------------------------
# `packages/contracts` 와 `packages/vision` 은 서버·시뮬레이터·엣지가 공유하는
# 실제 배포 패키지다. `server` · `sim` · `edge` 는 레포 루트에서 실행되는 앱이므로
# 휠로 빌드하지 않고(`package = false`) 의존성만 워크스페이스 해석에 참여시킨다.
[tool.uv.workspace]
members = ["packages/contracts", "packages/vision", "server", "sim", "edge", "recorder"]

[tool.uv.sources]
aegis-contracts = { workspace = true }
aegis-vision = { workspace = true }

[dependency-groups]
dev = [
    "aegis-contracts",
    "aegis-vision",
    "httpx2>=2.0",     # starlette.testclient 가 요구한다 (httpx 는 deprecated)
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

# 학습된 `.pt` → `.onnx` **일회성 변환에만** 쓴다 (`scripts/export_onnx.py`).
#
# 기본 설치에 넣지 않는 이유는 크기다 — torch 와 ultralytics 를 합치면 수 GB 이고,
# 서버·시뮬레이터·테스트 어디도 이것을 필요로 하지 않는다. 엣지 런타임도 마찬가지다
# (`edge/pyproject.toml` 은 onnxruntime 만 쓴다). 변환은 모델을 새로 학습했을 때만
# 다시 하면 되므로 명시적으로 설치한다:
#
#     uv sync --group export
export = [
    "onnx>=1.17",
    "onnxslim>=0.1.48",
    "torch>=2.6",
    "ultralytics>=8.3",
]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/contracts/src", "packages/vision/src", "."]
extend-exclude = ["front", "media", "models", "server/infra/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle error
    "W",    # pycodestyle warning
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "DTZ",  # flake8-datetimez — naive datetime 차단
    "T20",  # print 금지 (시뮬레이터·스크립트는 아래에서 예외)
    "SIM",  # simplify
    "TID",  # tidy imports
    "PTH",  # pathlib 사용
    "RUF",
]
ignore = [
    "RUF001", # 한글 문자열의 전각 문장부호를 모호 문자로 보고 잡는 것을 끈다
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 시뮬레이터·스크립트·태스크 러너는 콘솔 출력이 본래 목적이다.
"sim/**" = ["T20"]
"scripts/**" = ["T20"]
"tasks.py" = ["T20"]
"deploy/**" = ["T20"]
# RealClock 구현체는 시스템 시계를 읽는 유일한 곳이다.
"packages/vision/src/aegis_vision/clock.py" = ["DTZ005"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# --------------------------------------------------------------------------
# mypy (strict)
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "packages/contracts/src:packages/vision/src:."
files = ["packages", "server", "recorder", "sim", "edge", "scripts", "deploy", "tasks.py"]
exclude = "(^front/|^media/|^models/|/migrations/versions/)"
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# 엣지 추론 스택은 타입 스텁을 제공하지 않거나 불완전하다. `ultralytics` 는 일회성
# 변환 스크립트에서만 쓰이며 기본 설치에도 없다(`export` 그룹).
#
# `tensorrt` · `cuda` 는 **젯슨에만 있다.** JetPack 이 apt 로 깔아 주는 것이라 PyPI 에
# aarch64 휠이 없고, 노트북에는 설치할 수도 없다. `edge/session.py` 가 지연 import 로
# 감싸 두었으므로 없는 기계에서도 `onnx` 백엔드는 그대로 돈다.
# `onnx` 는 엔진 빌드 스크립트가 클래스 이름을 뽑을 때만 쓴다(젯슨, 일회성).
[[tool.mypy.overrides]]
module = ["cv2.*", "onnxruntime.*", "ultralytics.*", "tensorrt.*", "cuda.*", "onnx.*"]
ignore_missing_imports = true
# ultralytics 는 `YOLO` 를 `__init__` 에서 재수출하지만 `__all__` 로 선언하지 않는다.
# 일회성 변환 스크립트에서만 쓰므로 여기서 허용한다.
implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = [
    "packages/contracts/tests",
    "packages/vision/tests",
    "server/tests",
    "recorder/tests",
    "sim/tests",
    "edge/tests",
    "scripts/tests",
]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
