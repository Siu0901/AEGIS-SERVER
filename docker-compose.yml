# AEGIS 로컬 개발 스택
#
#   uv run tasks.py dev     — 아래 서비스 기동 + 서버 + 프론트
#   uv run tasks.py cams    — mediamtx 경로에 가짜 RTSP 송출
#
# 전부 현장 내(Tier 1)에서 도는 것들이다. 인터넷이 끊겨도 감지·경고·기록·시정판정·
# 라이브뷰·SQL 통계가 정상 동작해야 한다(기능명세서 §7 가용성).
#
# 값은 `.env` 에서 읽는다(`.env.example` 견본). compose 와 서버·REC 이 같은 파일을 보므로
# 자격증명·포트를 두 곳에 따로 적어 어긋나는 일이 없다. `:-` 기본값은 `.env` 가 아직
# 없을 때를 위한 것이며, 실제 개발에서는 `.env` 를 만들어 쓴다.

name: aegis

services:
  postgres:
    # pgvector 확장 포함 이미지. events.embedding · normal_pool.embedding 이
    # halfvec(3072) 이므로 확장이 없으면 마이그레이션이 실패한다(FN-AI-01).
    image: pgvector/pgvector:pg16
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mosquitto:
    # 서버 → ESP32 경고 발동(aegis/alert), ESP32 → 서버 상태(aegis/device/status)
    image: eclipse-mosquitto:2
    container_name: aegis-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket (브라우저 디버깅용)
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  mediamtx:
    # 가짜 IP 카메라용 RTSP 서버. 카메라 2대 × (main 1080p / sub 640p)
    #
    # **녹화는 여기서 하지 않는다.** mediamtx 는 RTSP 수신과 재송출(WHEP · HLS)만 하고,
    # 7일 링버퍼 녹화는 REC 컴포넌트(recorder/)가 담당한다(기능명세서 §4.4 REC 분리).
    image: bluenviron/mediamtx:latest
    container_name: aegis-mediamtx
    ports:
      - "8554:8554"       # RTSP  — 카메라 송출 · 서버/REC 구독
      - "1935:1935"       # RTMP  (송출 편의용)
      - "8888:8888"       # HLS   — 대시보드 라이브뷰 폴백
      - "8889:8889"       # WebRTC(WHEP) — 대시보드 라이브뷰 기본 경로
      - "8189:8189/udp"   # WebRTC ICE mux (UDP 우선)
      - "8189:8189/tcp"   # WebRTC ICE mux (UDP 차단 환경 폴백)
      - "9997:9997"       # 제어 API — 서버가 폴링해 스트림 상태를 관측(FN-SYS-01)
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mosquitto_data:
  mosquitto_log:
