#
# 조항 번호는 사실이고, 생성 모델은 그럴듯한 번호를 만들어낸다. 관리자가 이 화면을
# 보고 시정 조치를 지시하는데 존재하지 않는 조항이 근거로 붙으면, 틀린 것보다 나쁘다 —
# 틀렸다는 사실조차 확인할 수 없기 때문이다. 그래서 LLM 에는 이 결과를 **입력으로**
# 넣고, 조항을 물어보지 않는다(기능명세서 §4.5 FN-AI-06).
#
# 표를 고칠 때는 조항 원문을 확인하고 `checked_at` 을 갱신한다. 근거 없이 늘리지 마라.

version: 1
source: 산업안전보건기준에 관한 규칙 (고용노동부령)
checked_at: 2026-08-01

mappings:
  no_helmet:
    - code: 산업안전보건기준에 관한 규칙 제32조
      title: 보호구의 지급 등
      summary: 사업주는 작업조건에 맞는 보호구를 지급하고 착용하도록 하여야 한다.
    - code: 산업안전보건기준에 관한 규칙 제33조
      title: 보호구의 관리
      summary: 지급한 보호구를 상시 점검하여 이상이 있는 것은 수리하거나 교환해 주어야 한다.

  zone_intrusion:
    - code: 산업안전보건기준에 관한 규칙 제20조
      title: 출입의 금지 등
      summary: 위험 장소에는 관계 근로자가 아닌 사람의 출입을 금지하고 그 뜻을 표시하여야 한다.
    - code: 산업안전보건기준에 관한 규칙 제172조
      title: 출입의 금지
      summary: 차량계 하역운반기계의 운전 중 접촉 위험이 있는 장소에 근로자를 출입시켜서는 안 된다.

  proximity:
    - code: 산업안전보건기준에 관한 규칙 제172조
      title: 출입의 금지
      summary: 차량계 하역운반기계의 접촉 위험 범위에 근로자를 출입시켜서는 안 된다.
    - code: 산업안전보건기준에 관한 규칙 제39조
      title: 작업지휘자의 지정
      summary: 차량계 하역운반기계 작업 시 작업지휘자를 지정해 작업순서와 유도를 담당하게 한다.
    - code: 산업안전보건기준에 관한 규칙 제179조
      title: 전조등 등의 설치
      summary: 지게차에는 전조등과 후미등, 헤드가드와 백레스트를 갖추어야 한다.

  fall:
    - code: 산업안전보건법 제54조
      title: 중대재해 발생 시 사업주의 조치
      summary: 중대재해가 발생하면 즉시 작업을 중지하고 근로자를 대피시킨 뒤 필요한 안전조치를 한다.
    - code: 산업안전보건기준에 관한 규칙 제3조
      title: 전도의 방지
      summary: 근로자가 넘어지거나 미끄러질 위험이 있는 장소는 청결·건조 상태를 유지한다.
