# 유사 사고사례 시드 (FN-AI-07 · KOSHA 재해사례 요약)
#
# 확정 이벤트와 **임베딩 유사도**로 매칭해 `events.similar_incidents` 에 저장한다.
# 확정 시 1회 계산해 굳힌다 — 조회할 때마다 다시 계산하면 시드가 바뀌었을 때 지나간
# 이벤트의 근거가 소급해서 달라진다(기능명세서 §6 「확정 시 1회 계산해 저장」).
#
# ★ **요약문이다.** KOSHA 원문을 그대로 옮기지 않고 상황·원인·대책을 한 줄씩 줄였다.
#   `url` 은 사람이 원문을 확인하는 통로이지 시스템이 읽는 값이 아니다.
#
# 매칭은 이 `text` 를 임베딩한 벡터와 이벤트 키프레임 임베딩의 코사인 유사도다.
# 클라우드가 없으면 `violation_type` 이 같은 사례를 최근 순으로 내려 **비워두지 않는다** —
# 유사도는 그때 `null` 이며, 화면은 그 사실을 구분해 보여준다.

version: 1
source: KOSHA 산업재해 사례 (요약)
checked_at: 2026-08-01

incidents:
  - id: KOSHA-2024-FL-001
    title: 지게차 후진 중 보행 근로자 충돌 사망
    violation_type: proximity
    year: 2024
    text: >-
      자재 창고에서 지게차가 후진하던 중 뒤쪽에서 걸어오던 근로자를 보지 못하고 충돌했다.
      적재 화물이 운전자의 전방 시야를 가렸고 후방 확인을 유도할 작업지휘자가 없었다.
      통행로와 작업 구역을 분리하고 후방 감지 장치를 설치해야 한다.
    url: https://www.kosha.or.kr/

  - id: KOSHA-2023-FL-002
    title: 지게차 포크에 협착되어 중상
    violation_type: proximity
    year: 2023
    text: >-
      지게차가 팔레트를 내려놓는 동안 근로자가 포크 앞쪽으로 들어가 화물과 벽 사이에 끼였다.
      운전자는 근로자가 사각지대에 있는 것을 인지하지 못했다.
      하역 작업 중에는 지게차 반경 안으로 사람이 들어가지 못하게 통제해야 한다.
    url: https://www.kosha.or.kr/

  - id: KOSHA-2024-PPE-003
    title: 낙하물에 머리를 맞아 사망 — 안전모 미착용
    violation_type: no_helmet
    year: 2024
    text: >-
      상부 작업대에서 떨어진 자재에 머리를 맞아 근로자가 사망했다. 재해자는 안전모를
      착용하지 않은 상태였고 작업 구역 아래에 방호선반이 없었다.
      보호구 착용을 상시 점검하고 낙하 위험 구역의 출입을 통제해야 한다.
    url: https://www.kosha.or.kr/

  - id: KOSHA-2022-PPE-004
    title: 이동 중 넘어지며 머리 부상 — 보호구 미착용
    violation_type: no_helmet
    year: 2022
    text: >-
      작업장 통로에서 근로자가 미끄러져 넘어지며 바닥 구조물에 머리를 부딪쳤다.
      안전모를 착용하지 않아 충격이 그대로 전달됐다.
      통로 청결 유지와 보호구 착용 관리가 함께 이루어져야 한다.
    url: https://www.kosha.or.kr/

  - id: KOSHA-2023-ZN-005
    title: 프레스 방호구역 침입 중 협착 사망
    violation_type: zone_intrusion
    year: 2023
    text: >-
      프레스 금형 사이에 이물을 제거하려고 방호 구역 안으로 상체를 넣은 근로자가
      슬라이드 하강에 협착됐다. 방호장치가 해제된 상태였고 출입 금지 표시가 없었다.
      위험 구역의 출입을 물리적으로 차단하고 방호장치 해제를 금지해야 한다.
    url: https://www.kosha.or.kr/

  - id: KOSHA-2024-ZN-006
    title: 컨베이어 하부 통제구역 진입 중 끼임
    violation_type: zone_intrusion
    year: 2024
    text: >-
      가동 중인 컨베이어 하부의 통제 구역에 들어가 청소하던 근로자가 롤러에 끼였다.
      정지 절차 없이 진입했고 구역 경계 표시가 지워져 있었다.
      가동 중 진입 금지와 잠금·표지 절차를 지켜야 한다.
    url: https://www.kosha.or.kr/

  - id: KOSHA-2023-FA-007
    title: 작업 중 쓰러진 근로자 발견 지연으로 사망
    violation_type: fall
    year: 2023
    text: >-
      야간 단독 작업 중 쓰러진 근로자가 다음 교대까지 발견되지 않아 사망했다.
      1인 작업 구역에 이상 감지 수단이 없었다.
      단독 작업 시 주기적 확인과 이상 상황 자동 통보 체계가 필요하다.
    url: https://www.kosha.or.kr/

  - id: KOSHA-2022-FA-008
    title: 열사병으로 쓰러진 근로자 구호 지연
    violation_type: fall
    year: 2022
    text: >-
      고온 작업장에서 근로자가 의식을 잃고 쓰러졌으나 주변에 사람이 없어 구호가 늦었다.
      휴식 시간과 온열질환 예방 조치가 지켜지지 않았다.
      쓰러짐을 즉시 알리고 관리자가 확인하는 절차가 있어야 한다.
    url: https://www.kosha.or.kr/
